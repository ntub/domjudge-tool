name: Dependabot monthly report

# Once a month, summarize open Dependabot alerts in a single issue. This
# workflow only reads alerts and opens that issue: it never opens pull
# requests, changes dependencies, or dismisses alerts.
on:
  schedule:
    - cron: '17 1 1 * *' # 01:17 UTC on the 1st of each month
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-report
  cancel-in-progress: false

jobs:
  report:
    name: Open the monthly alert issue
    runs-on: ubuntu-24.04
    permissions:
      contents: read # mise.toml and mise.lock
      issues: write # open the report issue
      vulnerability-alerts: read # list Dependabot alerts
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned GitHub CLI from mise.lock
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.14
          install_args: gh
          cache: false

      - name: Open one issue for this month
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MISE_AUTO_INSTALL: 'false'
        run: mise run dependabot-report
