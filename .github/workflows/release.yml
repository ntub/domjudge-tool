name: Release

# The only publishing path: pushing an annotated vMAJOR.MINOR.PATCH tag that
# points at a commit on main. Create it with `mise run release-tag vX.Y.Z`.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and release notes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools from mise.lock
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.14
          install_args: python
          cache: false

      - name: Require an annotated main tag and its CHANGELOG.md section
        env:
          MISE_AUTO_INSTALL: 'false'
          TAG: ${{ github.ref_name }}
        run: mise run release-verify "$TAG"

      - name: Keep the release notes for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  checks:
    name: CI gates
    needs: verify
    permissions:
      contents: read
    # Job-level ./ calls already run the caller's commit. Switch to $/ once
    # actionlint understands it (rhysd/actionlint#732).
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  cli:
    name: CLI archives
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools from mise.lock
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.14
          install_args: go goreleaser
          cache: false

      - name: Build CLI archives and checksums without publishing
        env:
          MISE_AUTO_INSTALL: 'false'
          # Pin GoReleaser to the verified tag when HEAD carries several.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: mise run release-cli

      - name: Keep the CLI archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: |
            dist/cli/*.tar.gz
            dist/cli/*.zip
            dist/cli/checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [verify, checks, cli]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign provenance with Sigstore
      attestations: write # store provenance attestations
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned GitHub CLI from mise.lock
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.14
          install_args: gh
          cache: false

      - name: Download release notes and CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{release-notes,cli}'
          path: release
          merge-multiple: true

      - name: Stage installer scripts as release assets
        run: |
          set -euo pipefail
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1

      - name: Verify CLI archive checksums before publishing
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum --strict --check checksums.txt
          count=$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)
          # 6 CLI archives (linux/darwin/windows on amd64/arm64).
          test "$count" -eq 6

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.tar.gz
            release/checksums.txt
            release/install.sh
            release/install.ps1
      - name: Create the release with CHANGELOG.md notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MISE_AUTO_INSTALL: 'false'
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mise exec -- gh release create "$TAG" \
            --verify-tag \
            --title "domjudge-tool $TAG" \
            --notes-file release/release-notes.md \
            release/*.zip release/*.tar.gz release/checksums.txt release/install.sh release/install.ps1
