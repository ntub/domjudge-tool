name: Release smoke

# Downloads a published release on each native platform and runs what a user
# would: checksum and provenance checks, the installer scripts, and the
# local web UI command. Read-only; run it after release.yml finishes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, vMAJOR.MINOR.PATCH
        required: true
        type: string

permissions: {}

concurrency:
  group: release-smoke-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  smoke:
    name: ${{ matrix.goos }}/${{ matrix.goarch }} download and run
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, goos: darwin, goarch: amd64, ext: tar.gz}
          - {runner: macos-15, goos: darwin, goarch: arm64, ext: tar.gz}
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64, ext: tar.gz}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, ext: tar.gz}
          - {runner: windows-2025, goos: windows, goarch: amd64, ext: zip}
          - {runner: windows-11-arm, goos: windows, goarch: arm64, ext: zip}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # download release assets and checkout scripts
      attestations: read # verify provenance
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      GOOS_NAME: ${{ matrix.goos }}
      GOARCH_NAME: ${{ matrix.goarch }}
      ARCHIVE_EXT: ${{ matrix.ext }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download CLI archive and verify checksum and attestation
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          }
          work="$RUNNER_TEMP/smoke-download"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          cli="domjudge-tool_${GOOS_NAME}_${GOARCH_NAME}.${ARCHIVE_EXT}"
          gh release download "$TAG" --repo "$GH_REPO" --pattern checksums.txt --pattern "$cli"
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          grep -F "  $cli" checksums.txt | sum -c -
          gh attestation verify "$cli" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG"

      - name: Test installer script (Unix)
        if: matrix.goos != 'windows'
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/unix-install/bin"
          rm -rf "$RUNNER_TEMP/unix-install"
          DOMJUDGE_TOOL_VERSION="$TAG" DOMJUDGE_TOOL_INSTALL_DIR="$test_dir" sh scripts/install.sh

          # A new terminal runs an interactive shell; Ubuntu's ~/.bashrc
          # returns early when sourced non-interactively.
          version="$("${SHELL:-/bin/bash}" -ic 'command -v domjudge-tool && domjudge-tool version' 2>/dev/null)"
          echo "$version"
          [[ "$version" == *"$test_dir/domjudge-tool"* ]]
          [[ "$version" == *"${TAG#v}"* ]]

      - name: Test installer script (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG

          if (Get-Command pwsh -ErrorAction SilentlyContinue) {
            Write-Host "Testing install.ps1 with pwsh..."
            $dirPwsh = Join-Path $env:RUNNER_TEMP "ps-install-pwsh\bin"
            if (Test-Path $dirPwsh) { Remove-Item -Recurse -Force $dirPwsh }
            $env:DOMJUDGE_TOOL_VERSION = $tag
            $env:DOMJUDGE_TOOL_INSTALL_DIR = $dirPwsh
            & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1

            $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
            if ($userPath -notlike "*$dirPwsh*") {
              Write-Error "dirPwsh was not added to User PATH"
            }
            $env:Path = "$dirPwsh;$env:Path"
            $cmd = Get-Command domjudge-tool.exe -ErrorAction Stop
            Write-Host "Resolved: $($cmd.Source)"
            $ver = & domjudge-tool version
            Write-Host "Version output: $ver"
            if ($ver -notlike "*$($tag.TrimStart('v'))*") {
              Write-Error "Version mismatch: expected $tag in $ver"
            }
          }

          if (Get-Command powershell -ErrorAction SilentlyContinue) {
            Write-Host "Testing install.ps1 with Windows PowerShell..."
            $dirWinPs = Join-Path $env:RUNNER_TEMP "ps-install-winps\bin"
            if (Test-Path $dirWinPs) { Remove-Item -Recurse -Force $dirWinPs }
            $env:DOMJUDGE_TOOL_VERSION = $tag
            $env:DOMJUDGE_TOOL_INSTALL_DIR = $dirWinPs
            & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1

            $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
            if ($userPath -notlike "*$dirWinPs*") {
              Write-Error "dirWinPs was not added to User PATH"
            }
            $env:Path = "$dirWinPs;$env:Path"
            $cmd = Get-Command domjudge-tool.exe -ErrorAction Stop
            Write-Host "Resolved: $($cmd.Source)"
            $ver = & domjudge-tool version
            Write-Host "Version output: $ver"
            if ($ver -notlike "*$($tag.TrimStart('v'))*") {
              Write-Error "Version mismatch: expected $tag in $ver"
            }
          }

      - name: Verify local web UI command
        run: |
          set -euo pipefail
          exe=""
          [ "$GOOS_NAME" = "windows" ] && exe=".exe"
          bin_path="$RUNNER_TEMP/unix-install/bin/domjudge-tool$exe"
          if [ "$GOOS_NAME" = "windows" ]; then
            if [ -f "$RUNNER_TEMP/ps-install-pwsh/bin/domjudge-tool$exe" ]; then
              bin_path="$RUNNER_TEMP/ps-install-pwsh/bin/domjudge-tool$exe"
            else
              bin_path="$RUNNER_TEMP/ps-install-winps/bin/domjudge-tool$exe"
            fi
          fi

          if ! "$bin_path" help web >/dev/null 2>&1; then
            echo "::notice::Release $TAG predates domjudge-tool web; skipping web UI smoke."
            exit 0
          fi

          web_dir="$RUNNER_TEMP/web-smoke"
          rm -rf "$web_dir"
          mkdir -p "$web_dir"
          web_log="$web_dir/web.log"
          cookies="$web_dir/cookies.txt"
          body="$web_dir/page.html"
          db_path="$web_dir/web.db"

          "$bin_path" web --no-browser --port 0 --db "$db_path" > "$web_log" 2>&1 &
          web_pid=$!

          cleanup() {
            if [ "$GOOS_NAME" = "windows" ]; then
              taskkill //F //IM domjudge-tool.exe 2>/dev/null || true
            else
              kill "$web_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          token_url=""
          for _ in $(seq 1 30); do
            if [ -f "$web_log" ]; then
              token_url="$(grep -m1 '^Open in your browser: ' "$web_log" | sed 's/^Open in your browser: //' | tr -d '\r' || true)"
              [ -n "$token_url" ] && break
            fi
            sleep 1
          done

          if [ -z "$token_url" ]; then
            echo "::error::domjudge-tool web did not output 'Open in your browser: ' within 30s"
            cat "$web_log"
            exit 1
          fi

          echo "Detected token URL: $token_url"
          base_url="${token_url%%\?*}"
          base_url="${base_url%/}/"

          # 1. Request URL with cookie jar; expect 200 containing 'Server Profiles'
          status="$(curl -s -L -c "$cookies" -b "$cookies" -o "$body" -w '%{http_code}' "$token_url")"
          if [ "$status" != "200" ]; then
            echo "::error::Expected HTTP 200 from token URL, got $status"
            cat "$web_log"
            exit 1
          fi
          if ! grep -q 'Server Profiles' "$body"; then
            echo "::error::Response did not contain 'Server Profiles'"
            cat "$body"
            exit 1
          fi
          echo "Verified web UI served HTTP 200 with Server Profiles."

          # 2. Request base URL without token / cookies; expect 401
          status_unauth="$(curl -s -o /dev/null -w '%{http_code}' "$base_url")"
          if [ "$status_unauth" != "401" ]; then
            echo "::error::Expected HTTP 401 for unauthenticated request to $base_url, got $status_unauth"
            exit 1
          fi
          echo "Verified unauthenticated request returned HTTP 401."
