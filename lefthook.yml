# lefthook.yml — git hooks for domjudge-tool.
# Install with `mise run setup` (runs `lefthook install`). Commands run
# through mise so hooks use the pinned tools even without shell activation.
# Hooks are advisory; CI is the real gate.

pre-commit:
  parallel: false
  commands:
    fmt:
      priority: 1
      glob: "*.go"
      run: mise exec -- gofumpt -w {staged_files}
      stage_fixed: true

    lint:
      priority: 2
      glob: "*.go"
      run: mise run lint

    user-guide:
      priority: 3
      run: mise exec -- python3 scripts/update_user_guide.py hook --timeout 600

commit-msg:
  commands:
    conventional:
      # Conventional Commits: type(scope)?: subject
      # Allowed types track docs/COMMITS.md.
      run: |
        msg_file={1}
        first_line=$(head -n1 "$msg_file")
        # Allow merge / revert commits unmodified.
        case "$first_line" in
          "Merge "*|"Revert "*) exit 0 ;;
        esac
        if ! echo "$first_line" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'; then
          echo "✗ Commit message does not follow Conventional Commits."
          echo "  See docs/COMMITS.md for examples."
          echo "  Got: $first_line"
          exit 1
        fi

pre-push:
  commands:
    test:
      run: mise run test
