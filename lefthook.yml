# lefthook.yml — git hooks for domjudge-tool.
# Install with `just setup` (runs `lefthook install`).
# Hooks are advisory; CI is the real gate.

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.go"
      run: |
        if command -v gofumpt >/dev/null 2>&1; then
          gofumpt -w {staged_files}
        else
          gofmt -s -w {staged_files}
        fi
        git add {staged_files}
      stage_fixed: true

    lint:
      glob: "*.go"
      run: |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run ./...
        else
          echo "⚠ golangci-lint not installed; skipping (CI will catch it)"
        fi

commit-msg:
  commands:
    conventional:
      # Conventional Commits: type(scope)?: subject
      # Allowed types track docs/COMMITS.md.
      run: |
        msg_file={1}
        first_line=$(head -n1 "$msg_file")
        # Allow merge / revert commits unmodified.
        case "$first_line" in
          "Merge "*|"Revert "*) exit 0 ;;
        esac
        if ! echo "$first_line" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'; then
          echo "✗ Commit message does not follow Conventional Commits."
          echo "  See docs/COMMITS.md for examples."
          echo "  Got: $first_line"
          exit 1
        fi

pre-push:
  commands:
    test:
      run: just test
