# cliff.toml — git-cliff config for domjudge-tool.
# Generates CHANGELOG.md from Conventional Commits. See docs/COMMITS.md.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/).

<!--
Hand-curated release sections (under `## [N.N.N] - YYYY-MM-DD` headings)
take precedence over git-cliff output for tagged versions: edit them
freely. The auto-generated `## [Unreleased]` block and any
`### Generated changelog (git-cliff)` appendices below tagged versions
are regenerated by `just changelog` from Conventional Commits — do not
hand-edit those blocks; they will be overwritten.
-->
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
    { message = "^feat",      group = "<!-- 0 -->Features" },
    { message = "^fix",       group = "<!-- 1 -->Fixes" },
    { message = "^perf",      group = "<!-- 2 -->Performance" },
    { message = "^refactor",  group = "<!-- 3 -->Refactor" },
    { message = "^docs",      group = "<!-- 4 -->Documentation" },
    { message = "^test",      group = "<!-- 5 -->Testing" },
    { message = "^build",     group = "<!-- 6 -->Build" },
    { message = "^ci",        group = "<!-- 7 -->CI" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore",     group = "<!-- 8 -->Chore" },
    { message = "^revert",    group = "<!-- 9 -->Reverts" },
    { body = ".*security",    group = "<!-- 10 -->Security" },
    { message = "^Merge",     skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
