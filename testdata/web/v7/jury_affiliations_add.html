    <h1>Add affiliation</h1>

    <div class="row col-lg-4">
    <form name="team_affiliation" method="post"><div id="team_affiliation"><div class="form-group"><label for="team_affiliation_shortname" class="required">Shortname</label><input type="text" id="team_affiliation_shortname" name="team_affiliation[shortname]" required="required" maxlength="32" class="form-control" /></div><div class="form-group"><label for="team_affiliation_name" class="required">Name</label><input type="text" id="team_affiliation_name" name="team_affiliation[name]" required="required" maxlength="255" class="form-control" /></div><div class="form-group"><label class="" for="team_affiliation_country">Country</label><select id="team_affiliation_country" name="team_affiliation[country]" class="form-control custom-select form-control"><option value="">No country</option><option value="AFG">Afghanistan (AFG)</option><option value="ALB">Albania (ALB)</option><option value="DZA">Algeria (DZA)</option></select></div><div class="form-group"><label for="team_affiliation_comments">Comments</label><textarea id="team_affiliation_comments" name="team_affiliation[comments]" rows="6" class="form-control"></textarea></div><div class="form-group"><button type="submit" id="team_affiliation_save" name="team_affiliation[save]" class="btn-primary btn">Save</button></div></div></form>
</div>

<script>
    var template = function(element) {
        var imgBase = '';
                        // Use a country flag we know exists to automatically determine base path and asset version
        imgBase = "/images/countries/NLD.png?v=7.3.4";
        
        var img = element.id == undefined || element.id == "" || imgBase == ""
            ? ''
            : '<img src="' + imgBase.replace("NLD.png", element.id + ".png", 1) + '" class="countryflag">&nbsp;';

        return img + element.text;
    };

    $('#team_affiliation_country').select2({
        templateResult: template,
        templateSelection: template,

        // Prevent escaping
        escapeMarkup: function(t) {
            return t;
        },
        theme: "bootstrap"
    });

</script>

<script>
            var domjudge_base_url = "";
        $(function () {
        $('body').on('change', '.custom-file-input', function () {
            var files = this.files;
            var fileNames = [];
            for (var i = 0; i < files.length; i++) {
                fileNames.push(files.item(i).name);
            }
            $(this).next('.custom-file-label').html(fileNames.join(", "));
            $(this).next('.custom-file-label').removeClass('text-muted');
        });

        /* toggle refresh if set */
                /* Enable page refresh if set if wanted by the page, and wanted by the user */
        
        initializeAjaxModals();
    });
</script>

                } else {
